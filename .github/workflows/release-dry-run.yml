name: Release Dry-Run

# Catches release-flow regressions at PR time, not at tag time.
# Source: v1.75.1 CHANGELOG post-mortem item (a), Codex design review
# .reviews/176-followup-prio-codex.md (A1).
#
# Design constraints (load-bearing, gated by tests/test-release-dry-run-workflow.sh):
#
#   1. permissions: contents: read — ABSOLUTELY NO id-token: write.
#      Reason: npm CLI runs OIDC setup BEFORE the dry-run branch. With
#      id-token: write present it may attempt GitHub OIDC token retrieval
#      and npm token exchange even though it never PUTs the package. The
#      dry-run job proves PACKAGING; publish auth stays in release.yml.
#
#   2. Temp version rewrite — DO NOT run `npm publish --dry-run` directly
#      against the checked-in package.json. The current version (1.x.y)
#      is already published, and npm errors with "cannot publish over
#      previously published versions". --force works but disables
#      protections. Instead we rewrite to an unpublished prerelease.
#
#   3. node-version + npm guard parity with release.yml. If they drift,
#      the dry-run greens while the real publish breaks at tag-time —
#      exactly the failure mode this job is meant to prevent.
#
#   4. No --force, no --provenance, no NODE_AUTH_TOKEN, no NPM_TOKEN.
#      Provenance is auto-generated by Trusted Publishing on the real
#      publish; requesting it here is meaningless and may interact with
#      the OIDC subsystem we're trying NOT to wake up.
#
#   5. Paths filter is package-surface-aware. Every package.json.files
#      entry is in `paths:`; otherwise a PR adding a new shipped path
#      would not exercise this workflow.

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - 'tests/test-release-workflow.sh'
      - 'tests/test-release-dry-run-workflow.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.npmignore'
      - '.gitignore'
      - 'cli/**'
      - 'hooks/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - 'CLAUDE_CODE_SDLC_WIZARD.md'
      - 'AI_SETUP_LANES.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'LICENSE*'
  workflow_dispatch:

# Read-only by design. No id-token. No write scopes.
permissions:
  contents: read

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same Node + npm contract as release.yml. Tested for parity.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm CLI version (parity with release.yml — Trusted Publishing floor 11.5.1)
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          echo "npm CLI: $NPM_VERSION"
          MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NPM_VERSION" | cut -d. -f2)
          PATCH=$(echo "$NPM_VERSION" | cut -d. -f3 | grep -oE '^[0-9]+')
          if [ "$MAJOR" -lt 11 ] \
             || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; } \
             || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -lt 1 ]; }; then
            echo "::error::npm CLI $NPM_VERSION < 11.5.1 — Trusted Publishing requires 11.5.1+. Drift from release.yml."
            exit 1
          fi

      # Rewrite the package.json version to a dry-run prerelease so npm
      # doesn't error with "cannot publish over previously published
      # versions". Using the commit SHA keeps it unique per push.
      # Node-only rewrite preserves JSON formatting.
      - name: Rewrite package.json version to dry-run prerelease (avoid already-published collision)
        run: |
          set -euo pipefail
          DRYRUN_VERSION="0.0.0-dry-run-${GITHUB_SHA::7}"
          echo "Rewriting package.json version to $DRYRUN_VERSION (in-place, dry-run only)"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$DRYRUN_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json now at version', pkg.version);
          "

      # The dry-run itself. --tag dry-run keeps the prerelease out of any
      # real dist-tag namespace as defense in depth. --json gives us a
      # parseable list of shipped files for the assertion step below.
      - name: npm publish --dry-run (no OIDC, no token, no actual publish)
        id: dry_run
        run: |
          set -euo pipefail
          npm publish --dry-run --tag dry-run --json | tee dry-run-output.json
          # Sanity check: jq parses the output cleanly (catches malformed JSON).
          jq -e '.' dry-run-output.json >/dev/null

      # Assert every shipped path from package.json.files appears in the
      # dry-run package contents. If package.json.files silently drops a
      # path during a refactor, this is where it gets caught — before tag.
      - name: Assert shipped paths from package.json.files are in dry-run output
        run: |
          set -euo pipefail
          missing=()
          for path in cli/ skills/ hooks/ .claude-plugin/ CLAUDE_CODE_SDLC_WIZARD.md CHANGELOG.md; do
            # `npm publish --dry-run --json` includes a `files[]` array
            # listing every shipped file path. Match the path prefix to
            # detect at least one file from each entry.
            if ! jq -e --arg p "$path" '.files[]?.path | select(startswith($p))' dry-run-output.json >/dev/null; then
              missing+=("$path")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::dry-run output missing shipped paths: ${missing[*]}"
            echo "If package.json.files was edited intentionally, update tests/test-release-dry-run-workflow.sh too."
            exit 1
          fi
          echo "All 6 shipped paths present in dry-run output."
