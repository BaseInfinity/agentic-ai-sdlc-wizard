name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.36.0) — fallback when push-trigger misfires'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tagged commit is not on main branch. Aborting publish."
            exit 1
          }

      - name: Verify tag matches package.json version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="${INPUT_TAG#v}"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || {
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          }

      # Node 24 ships npm 11.x by default — required by npm Trusted Publishing
      # (OIDC). Previously this workflow used Node 22 + an explicit
      # `npm install -g npm@latest` step, but that in-place self-upgrade
      # hit `Cannot find module 'promise-retry'` (MODULE_NOT_FOUND) on the
      # GitHub-hosted runner during v1.75.0's release — a known npm CLI bug.
      # Bumping Node to 24 sidesteps the unreliable self-upgrade entirely.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm CLI version (Trusted Publishing needs ≥11.5.1)
        run: |
          set -euo pipefail
          NPM_VERSION=$(npm --version)
          echo "npm CLI: $NPM_VERSION"
          # Fail loudly if Node 24 ever ships an older npm. Trusted Publishing
          # silently falls back to token mode on npm <11.5.1, reproducing the
          # v1.74.0 EOTP failure. Better to fail here than mis-publish.
          # npm docs explicitly require 11.5.1+ — patch matters (11.5.0 must FAIL).
          MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NPM_VERSION" | cut -d. -f2)
          PATCH=$(echo "$NPM_VERSION" | cut -d. -f3 | grep -oE '^[0-9]+')
          # Three-tier check: major<11 OR (major==11 AND minor<5) OR
          # (major==11 AND minor==5 AND patch<1). Each gate is necessary.
          if [ "$MAJOR" -lt 11 ] \
             || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; } \
             || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "$PATCH" -lt 1 ]; }; then
            echo "::error::npm CLI $NPM_VERSION < 11.5.1 — Trusted Publishing requires 11.5.1+. Bump Node version or add explicit upgrade step."
            exit 1
          fi

      # No NODE_AUTH_TOKEN — npm Trusted Publishing uses GitHub Actions OIDC
      # (id-token: write) to authenticate against npm. The publisher is
      # configured on the npm package side: npmjs.com → agentic-sdlc-wizard →
      # Settings → Publishing access → GitHub Actions → repo
      # BaseInfinity/claude-sdlc-wizard, workflow release.yml.
      # --provenance is auto-generated on a trusted publish, so the flag is
      # redundant (kept omitted for clarity).
      - name: Publish to npm (Trusted Publishing — OIDC, no token)
        run: npm publish

      - name: Create GitHub Release
        run: gh release create "$TAG_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
